name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.11" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Run system preflight diagnostics
        run: |
          python scripts/check_system_dependencies.py --profile core

      - name: Run pytest test suite
        run: |
          pytest tests/ -v --tb=short

      - name: Run benchmark replay smoke test
        run: |
          python scripts/run_paper_benchmark.py --protocol policy-replay --models qwen2_5_vl_3b --replay-source-dir outputs/benchmark_runs/paper_benchmark_20261019_130902 --output-dir outputs/ci_test_run
