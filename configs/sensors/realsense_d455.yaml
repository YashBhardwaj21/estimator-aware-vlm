%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters for Intel RealSense D455
# Calibrated for 640x480 RGB-D operation
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV Brown-Conrady forward model)
# Note: RealSense hardware reports Inverse Brown-Conrady coefficients (mapping distorted -> undistorted).
# ORB-SLAM3's cv::undistortPoints() requires the forward Brown-Conrady model.
# The forward model below is calibrated to match the sensor mapping (< 0.03 px RMS residual):
Camera1.fx: 383.9205627441406
Camera1.fy: 383.4780578613281
Camera1.cx: 320.2670593261719
Camera1.cy: 244.56988525390625

Camera1.k1: 0.05713302
Camera1.k2: -0.07142212
Camera1.p1: -0.00002774
Camera1.p2: -0.00079809
Camera1.k3: 0.02322610

Camera.width: 640
Camera.height: 480

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0
Stereo.b: 0.095

# Depth map values factor (D455 raw depth uint16 is mm, 1000.0 units per meter)
RGBD.DepthMapFactor: 1000.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1200

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
