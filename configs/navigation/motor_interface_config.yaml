# Configuration for 4-Motor RC Car driven by L298N Dual H-Bridge Driver
# Target Hardware: Raspberry Pi 5 + L298N Dual H-Bridge + 4x Geared DC Motors

motor_interface:
  # Operation mode: "gpio" (RPi 5 native), "arduino_serial" (microcontroller bridge), or "mock" (simulation)
  interface_type: "mock"

  # Pinout Configuration (Raspberry Pi 5 BCM Pin Numbers)
  # Channel A (Left Motor Pair):
  ena_pin: 18      # Hardware PWM0 (Physical Pin 12)
  in1_pin: 17      # Direction IN1 (Physical Pin 11)
  in2_pin: 27      # Direction IN2 (Physical Pin 13)

  # Channel B (Right Motor Pair):
  enb_pin: 19      # Hardware PWM1 (Physical Pin 35)
  in3_pin: 22      # Direction IN3 (Physical Pin 15)
  in4_pin: 23      # Direction IN4 (Physical Pin 16)

  # Electrical & Dynamics Safety Caps:
  pwm_frequency_hz: 1000
  max_pwm_duty_pct: 70.0        # Cap maximum speed for indoor obstacle avoidance
  min_pwm_duty_pct: 25.0        # Minimum deadband overcome voltage
  watchdog_timeout_s: 0.20      # Failsafe hardware watchdog: 200 ms timeout

  # Differential Chassis Kinematics:
  track_width_m: 0.20           # Lateral distance between left & right wheels (20 cm)
  wheel_radius_m: 0.033         # Outer tire radius (66 mm diameter wheel)
  max_linear_speed_mps: 0.35    # Maximum safe linear velocity (35 cm/s)
  max_angular_speed_radps: 1.5  # Maximum safe yaw rate (1.5 rad/s)

  # Serial Microcontroller Bridge (When using Arduino):
  serial_port: "/dev/ttyACM0"
  serial_baud: 115200

# Hardware Bring-Up & Electrical Safety Checklist:
# 1. Power Supply Separation:
#    - Motors MUST be powered from dedicated external battery pack (e.g. 7.4V - 11.1V 2S/3S LiPo or 6x AA).
#    - NEVER draw DC motor current from the Raspberry Pi 5 5V/3.3V rail.
# 2. Common Ground:
#    - The external motor battery ground (GND), L298N power ground, and Raspberry Pi GND (Pin 6/9/14/20) MUST be tied together.
# 3. 5V Logic Regulator Jumper:
#    - Keep L298N onboard 5V regulator jumper ON if motor supply <= 12V.
# 4. Emergency Stop Cutoff:
#    - Maintain a physical toggle switch in series with the motor battery positive lead.
